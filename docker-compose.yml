services:
  whisper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whisper-server
    restart: unless-stopped
    ports:
      - "8178:8178"
    volumes:
    # Mount the models folder to the host to avoid re-downloading it every time the container restarts.
      - ./models:/app/models
    environment:
      WHISPER_MODEL: small       # tiny | base | small | medium | large
      WHISPER_HOST: 0.0.0.0
      WHISPER_PORT: 8178
      WHISPER_LANGUAGE: en       # en | id | auto
      WHISPER_THREADS: 4         # adjust to the number of cores of the M910q
    networks:
      - whisper-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8178/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s          # give time to download the model the first time

networks:
  whisper-network:
    name: whisper-server-network